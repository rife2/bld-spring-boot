name: bld-ci

on: [ push, pull_request, workflow_dispatch ]

jobs:
  build-bld-project:
    strategy:
      matrix:
        java-version: [ 17, 21, 25 ]
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: ${{ matrix.java-version }}

      - name: Cache bld dependencies
        id: cache-bld
        uses: actions/cache@v6
        with:
          path: |
            examples/3.5.x/lib
            examples/4.0.x/lib
            examples/4.1.x/lib
            lib
          key: ${{ runner.os }}-bld-java${{ matrix.java-version }}-lib

      - name: Compile source [3.5.x example]
        working-directory: examples/3.5.x
        run: ./bld --auto-download-purge clean compile

      - name: Run tests [3.5.x example]
        working-directory: examples/3.5.x
        run: ./bld test

      - name: Compile and create the JAR [3.5.x example]
        working-directory: examples/3.5.x
        run: ./bld bootjar

      - name: Compile and create the WAR [3.5.x example]
        working-directory: examples/3.5.x
        run: ./bld bootwar

      - name: Compile source [4.0.x example]
        working-directory: examples/4.0.x
        run: ./bld --auto-download-purge clean compile

      - name: Run tests [4.0.x example]
        working-directory: examples/4.0.x
        run: ./bld test

      - name: Compile and create the JAR [4.0.x example]
        working-directory: examples/4.0.x
        run: ./bld bootjar

      - name: Compile and create the WAR [4.0.x example]
        working-directory: examples/4.0.x
        run: ./bld bootwar

      - name: Compile source [4.1.x example]
        working-directory: examples/4.1.x
        run: ./bld --auto-download-purge clean compile

      - name: Run tests [4.1.x example]
        working-directory: examples/4.1.x
        run: ./bld test

      - name: Compile and create the JAR [4.1.x example]
        working-directory: examples/4.1.x
        run: ./bld bootjar

      - name: Compile and create the WAR [4.1.x example]
        working-directory: examples/4.1.x
        run: ./bld bootwar

      - name: Compile source code
        run: ./bld clean compile

      - name: Run tests
        id: tests
        run: ./bld test

      - name: Run reporter
        if: always() && steps.tests.outcome == 'failure'
        run: ./bld --offline reporter --all
